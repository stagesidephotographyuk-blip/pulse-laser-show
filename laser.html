<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pulse Laser Show</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="laser"></canvas>

<script>
const canvas = document.getElementById('laser');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

let t = 0;

function draw() {
  t += 0.01;
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for (let i = 0; i < 20; i++) {
    const x = canvas.width/2 + Math.sin(t + i)*300;
    const y = canvas.height/2 + Math.cos(t*1.5 + i)*300;

    ctx.strokeStyle = `hsl(${(t*100 + i*20)%360},100%,50%)`;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(canvas.width/2, canvas.height/2);
    ctx.lineTo(x, y);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
